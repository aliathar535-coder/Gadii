```html
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>चालक साथी - वाहन, पगार एवं प्रॉफिट/लॉस ट्रैकर</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Hind -->
    <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Hind', sans-serif;
            background-color: #0f172a;
            touch-action: manipulation;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen flex justify-center items-center p-0 md:p-4 text-gray-800 select-none">

    <!-- Mobile Frame Container -->
    <div class="w-full max-w-md bg-slate-50 min-h-screen md:min-h-[850px] md:max-h-[920px] md:rounded-[36px] shadow-2xl flex flex-col relative overflow-hidden border-0 md:border-[10px] border-gray-900">

        <!-- Status Bar -->
        <div class="bg-blue-900 text-white px-5 pt-2 pb-1 flex justify-between items-center text-xs font-semibold">
            <span><i class="fas fa-clock mr-1"></i>09:41 AM</span>
            <div class="flex items-center space-x-2">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-three-quarters text-green-400"></i>
            </div>
        </div>

        <!-- Header -->
        <header class="bg-gradient-to-r from-blue-800 to-indigo-800 text-white px-4 py-3 flex justify-between items-center shadow-lg z-20 sticky top-0">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-blue-800 shadow-md">
                    <i class="fas fa-steering-wheel text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide leading-none">चालक साथी</h1>
                    <span class="text-[11px] text-blue-200">वाहन, ड्राइवर एवं प्रॉफिट/लॉस प्रबंधक</span>
                </div>
            </div>
            <button onclick="switchTab('settings')" class="p-2 hover:bg-white/10 rounded-full transition" title="सेटिंग्स">
                <i class="fas fa-cog text-xl"></i>
            </button>
        </header>

        <!-- Month Switcher Strip -->
        <div class="bg-blue-100 border-b border-blue-200 px-4 py-2 flex justify-between items-center text-xs font-bold text-blue-900">
            <button onclick="changeMonth(-1)" class="hover:bg-blue-200 p-1.5 rounded-lg text-blue-800"><i class="fas fa-chevron-left"></i></button>
            <div class="flex items-center space-x-2">
                <i class="far fa-calendar-check text-blue-700 text-sm"></i>
                <span id="currentMonthText">इस महीने का हिसाब (अक्टूबर 2026)</span>
            </div>
            <button onclick="changeMonth(1)" class="hover:bg-blue-200 p-1.5 rounded-lg text-blue-800"><i class="fas fa-chevron-right"></i></button>
        </div>

        <!-- Scrollable Main Container -->
        <main id="mainContainer" class="flex-1 overflow-y-auto no-scrollbar p-4 space-y-4 pb-24">

            <!-- ================= TAB 1: DASHBOARD ================= -->
            <div id="tab-dashboard" class="space-y-4">
                
                <!-- 🌟 TOP PROMINENT PROFIT / LOSS BANNER (सबसे ऊपर प्रॉफिट/लॉस की जानकारी) -->
                <div id="topProfitLossBanner" class="rounded-2xl p-4 shadow-lg text-white transition-all border-2">
                    <div class="flex justify-between items-center border-b border-white/20 pb-2 mb-2">
                        <div class="flex items-center space-x-2">
                            <div id="topStatusBadgeIcon" class="w-7 h-7 rounded-full bg-white/20 flex items-center justify-center text-base">
                                <i id="statusIcon" class="fas fa-arrow-trend-up"></i>
                            </div>
                            <span id="topStatusTitle" class="text-xs font-bold uppercase tracking-wider">वर्तमान स्थिति: प्रॉफिट में है</span>
                        </div>
                        <span id="percentageBadge" class="bg-white/20 text-white text-[11px] font-extrabold px-2.5 py-1 rounded-full shadow-inner">
                            ↑ 21.61%
                        </span>
                    </div>

                    <div class="flex justify-between items-end my-1">
                        <div>
                            <div id="topNetLabel" class="text-xs font-medium text-white/80">सब जोड़ने-घटाने के बाद (Net Profit):</div>
                            <div id="topNetAmount" class="text-3xl font-black tracking-tight drop-shadow">₹ 14,800</div>
                        </div>
                        <div class="text-right">
                            <span id="statusTagText" class="inline-block bg-white text-emerald-800 font-extrabold text-xs px-3 py-1 rounded-lg shadow">
                                लाभ (PROFIT)
                            </span>
                        </div>
                    </div>

                    <!-- Sub Breakdown Strip inside banner -->
                    <div class="grid grid-cols-2 gap-2 mt-3 pt-2 border-t border-white/20 text-xs">
                        <div class="bg-black/20 p-2 rounded-xl flex justify-between items-center">
                            <span class="text-white/80 text-[11px]">कुल कमाई:</span>
                            <span id="bannerEarnings" class="font-extrabold">₹ 68,500</span>
                        </div>
                        <div class="bg-black/20 p-2 rounded-xl flex justify-between items-center">
                            <span class="text-white/80 text-[11px]">कुल खर्च:</span>
                            <span id="bannerExpenses" class="font-extrabold">₹ 53,700</span>
                        </div>
                    </div>
                </div>

                <!-- Total Earnings Card -->
                <div class="bg-white border border-emerald-200 rounded-2xl p-3.5 shadow-sm flex justify-between items-center">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center text-xl font-bold">
                            <i class="fas fa-wallet"></i>
                        </div>
                        <div>
                            <div class="text-xs font-bold text-gray-500 uppercase">कुल कमाई (Total Earnings)</div>
                            <div id="totalEarningsDisplay" class="text-2xl font-extrabold text-emerald-700">₹ 68,500</div>
                        </div>
                    </div>
                    <button onclick="switchTab('income')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-xl shadow">
                        + जोड़ें
                    </button>
                </div>

                <!-- Driver Salary Card -->
                <div class="bg-amber-50 border-2 border-amber-400 rounded-2xl p-3.5 shadow-sm flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="w-11 h-11 rounded-xl bg-amber-500 text-white flex items-center justify-center text-xl shadow">
                            <i class="fas fa-user-tie"></i>
                        </div>
                        <div>
                            <div class="text-xs font-bold text-amber-900">ड्राइवर की पगार (Driver Salary)</div>
                            <div id="driverSalaryDisplay" class="text-2xl font-extrabold text-amber-800">₹ 16,000</div>
                            <div class="text-[10px] font-semibold text-amber-700" id="driverStatusText">रामेश कुमार (मासिक तय: ₹16,000)</div>
                        </div>
                    </div>
                    <button onclick="switchTab('driver')" class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold px-3 py-2 rounded-xl shadow">
                        विवरण
                    </button>
                </div>

                <!-- Expense Breakdown Grid -->
                <div class="grid grid-cols-2 gap-3">
                    <!-- Maintenance -->
                    <div class="bg-white border border-orange-200 rounded-2xl p-3 shadow-sm flex flex-col justify-between">
                        <div class="flex items-center space-x-2">
                            <div class="w-8 h-8 rounded-lg bg-orange-100 flex items-center justify-center text-orange-600">
                                <i class="fas fa-tools"></i>
                            </div>
                            <div>
                                <div class="text-xs font-bold text-gray-800 leading-tight">गाड़ी मेंटेनेंस</div>
                                <div class="text-[9px] text-gray-500">Maintenance</div>
                            </div>
                        </div>
                        <div id="maintenanceCostDisplay" class="text-lg font-extrabold text-orange-600 mt-2">₹ 6,200</div>
                    </div>

                    <!-- Petrol Expense -->
                    <div class="bg-white border border-blue-200 rounded-2xl p-3 shadow-sm flex flex-col justify-between">
                        <div class="flex items-center space-x-2">
                            <div class="w-8 h-8 rounded-lg bg-blue-100 flex items-center justify-center text-blue-600">
                                <i class="fas fa-gas-pump"></i>
                            </div>
                            <div>
                                <div class="text-xs font-bold text-gray-800 leading-tight">पेट्रोल खर्च</div>
                                <div class="text-[9px] text-gray-500">Petrol Expense</div>
                            </div>
                        </div>
                        <div id="petrolCostDisplay" class="text-lg font-extrabold text-blue-600 mt-2">₹ 18,400</div>
                    </div>

                    <!-- CNG Expense -->
                    <div class="bg-white border border-teal-200 rounded-2xl p-3 shadow-sm flex flex-col justify-between">
                        <div class="flex items-center space-x-2">
                            <div class="w-8 h-8 rounded-lg bg-teal-100 flex items-center justify-center text-teal-600">
                                <i class="fas fa-fire-flame-simple"></i>
                            </div>
                            <div>
                                <div class="text-xs font-bold text-gray-800 leading-tight">सीएनजी खर्च</div>
                                <div class="text-[9px] text-gray-500">CNG Expense</div>
                            </div>
                        </div>
                        <div id="cngCostDisplay" class="text-lg font-extrabold text-teal-600 mt-2">₹ 12,100</div>
                    </div>

                    <!-- Toll & Parking -->
                    <div class="bg-white border border-purple-200 rounded-2xl p-3 shadow-sm flex flex-col justify-between">
                        <div class="flex items-center space-x-2">
                            <div class="w-8 h-8 rounded-lg bg-purple-100 flex items-center justify-center text-purple-600">
                                <i class="fas fa-road text-sm"></i>
                            </div>
                            <div>
                                <div class="text-xs font-bold text-gray-800 leading-tight">टॉल व पार्किंग</div>
                                <div class="text-[9px] text-gray-500">Toll & Parking</div>
                            </div>
                        </div>
                        <div id="tollParkingCostDisplay" class="text-lg font-extrabold text-purple-600 mt-2">₹ 1,000</div>
                    </div>
                </div>

                <!-- Total Expense Strip -->
                <div class="bg-gray-900 text-white rounded-2xl px-4 py-3 flex justify-between items-center shadow-md">
                    <div class="flex items-center space-x-2">
                        <i class="fas fa-calculator text-red-400"></i>
                        <span class="font-bold text-xs">कुल संपूर्ण खर्च (Total Expense)</span>
                    </div>
                    <span id="totalExpenseDisplay" class="text-xl font-extrabold text-red-400">₹ 53,700</span>
                </div>

                <!-- Trips History Table -->
                <div class="bg-white border border-gray-200 rounded-2xl p-3 shadow-sm">
                    <div class="flex justify-between items-center border-b pb-2 mb-2">
                        <h3 class="font-bold text-gray-800 text-xs flex items-center gap-1.5">
                            <i class="fas fa-list-check text-blue-600"></i> हाल ही की ट्रिप व कमाई
                        </h3>
                        <button onclick="switchTab('income')" class="text-[11px] bg-blue-600 hover:bg-blue-700 text-white px-2.5 py-1 rounded-lg font-bold shadow">
                            + नया भाड़ा
                        </button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-xs text-left">
                            <thead class="bg-gray-100 text-gray-600 border-b">
                                <tr>
                                    <th class="p-1.5">दिनांक</th>
                                    <th class="p-1.5">किमी</th>
                                    <th class="p-1.5">ग्राहक/रूट</th>
                                    <th class="p-1.5 text-right">किराया</th>
                                </tr>
                            </thead>
                            <tbody id="tripTableBody" class="divide-y text-gray-700">
                                <!-- Dynamic rows -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>

            <!-- ================= TAB 2: DRIVER MANAGEMENT ================= -->
            <div id="tab-driver" class="hidden space-y-4">
                <div class="bg-amber-600 text-white rounded-2xl p-4 shadow-lg">
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="text-xs font-semibold text-amber-100">चालक का नाम</div>
                            <div class="text-2xl font-bold" id="driverProfileName">रामेश कुमार</div>
                            <div class="text-xs text-amber-100 mt-1"><i class="fas fa-phone mr-1"></i>+91 98765 43210</div>
                        </div>
                        <div class="bg-white/20 p-2 rounded-xl text-center">
                            <div class="text-[10px] text-amber-100">मासिक तय पगार</div>
                            <div class="text-lg font-bold" id="fixedSalaryDisplay">₹ 16,000</div>
                        </div>
                    </div>
                </div>

                <div class="bg-white border rounded-2xl p-4 shadow-sm space-y-3">
                    <h3 class="font-bold text-gray-800 text-xs border-b pb-2 flex items-center gap-2">
                        <i class="fas fa-money-check-dollar text-amber-600"></i> पगार भुगतान की स्थिति
                    </h3>
                    
                    <div class="grid grid-cols-2 gap-2 text-center">
                        <div class="bg-green-50 border border-green-200 p-2.5 rounded-xl">
                            <div class="text-[11px] text-green-800 font-semibold">दिया गया पगार/एडवांस</div>
                            <div id="driverPaidDisplay" class="text-lg font-extrabold text-green-700">₹ 16,000</div>
                        </div>
                        <div class="bg-red-50 border border-red-200 p-2.5 rounded-xl">
                            <div class="text-[11px] text-red-800 font-semibold">शेष पगार बाकी</div>
                            <div id="driverDueDisplay" class="text-lg font-extrabold text-red-600">₹ 0</div>
                        </div>
                    </div>

                    <button onclick="quickAddDriverSalary()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 rounded-xl shadow flex items-center justify-center gap-2 text-xs">
                        <i class="fas fa-plus-circle"></i> ड्राइवर को पगार या एडवांस दें
                    </button>
                </div>

                <div class="bg-white border rounded-2xl p-3 shadow-sm">
                    <h3 class="font-bold text-gray-800 text-xs border-b pb-2 mb-2 flex items-center gap-2">
                        <i class="fas fa-history text-amber-600"></i> पगार भुगतान इतिहास
                    </h3>
                    <div id="driverSalaryHistoryList" class="space-y-2 text-xs">
                        <!-- Dynamic content -->
                    </div>
                </div>
            </div>

            <!-- ================= TAB 3: ADD EXPENSE ================= -->
            <div id="tab-expense" class="hidden space-y-4">
                <div class="bg-white border rounded-2xl p-4 shadow-sm">
                    <h2 class="text-sm font-bold text-gray-800 mb-3 border-b pb-2 flex items-center gap-2">
                        <i class="fas fa-minus-circle text-red-500"></i> नया खर्च दर्ज करें
                    </h2>
                    <form id="expenseForm" onsubmit="handleExpenseSubmit(event)" class="space-y-3">
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">खर्च की श्रेणी (Expense Category)</label>
                            <select id="expenseCategory" class="w-full border rounded-xl p-2.5 text-xs bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none" required>
                                <option value="driver">👨‍✈️ ड्राइवर की पगार / एडवांस (Driver Salary)</option>
                                <option value="petrol">⛽ पेट्रोल खर्च (Petrol Expense)</option>
                                <option value="cng">🔥 सीएनजी खर्च (CNG Expense)</option>
                                <option value="maintenance">🔧 गाड़ी मेंटेनेंस (Vehicle Maintenance)</option>
                                <option value="toll">🛣️ टॉल टैक्स (Toll Charge)</option>
                                <option value="parking">🅿️ पार्किंग (Parking)</option>
                                <option value="other">📦 अन्य खर्च (Other Expense)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">राशि (Amount - ₹)</label>
                            <input type="number" id="expenseAmount" placeholder="जैसे: 1500" class="w-full border rounded-xl p-2.5 text-xs bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none" required min="1">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">दिनांक (Date)</label>
                            <input type="date" id="expenseDate" class="w-full border rounded-xl p-2.5 text-xs bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none" required>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">विवरण / विवरण नोट (Note)</label>
                            <input type="text" id="expenseNote" placeholder="जैसे: सीएनजी फुल कराया या ऑयल बदला" class="w-full border rounded-xl
